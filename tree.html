<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<link rel="stylesheet" href="site.css">
<style>
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--card); font-size: 13px; }
#bar .who { font-family: var(--font-display); font-size: 16px; }
#bar input { font: inherit; padding: 5px 8px; border: 1px solid rgba(156,122,46,0.5); border-radius: 5px; width: 230px; background: #fff; }
#bar button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 5px; border: 1px solid rgba(156,122,46,0.55); background: #fff8f2; cursor: pointer; }
#results { position: absolute; z-index: 40; background: var(--panel-bg); border: 1px solid rgba(156,122,46,0.5); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  max-height: 320px; overflow: auto; min-width: 260px; display: none; }
#results div { padding: 5px 10px; cursor: pointer; font-size: 13px; }
#results div:hover, #results div.sel { background: rgba(156,122,46,0.15); }
#results span { color: var(--muted); font-size: 11px; margin-left: 5px; }
.key { display: flex; gap: 12px; color: var(--muted); font-size: 11.5px; margin-left: auto; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
#wrap { position: relative; flex: 1; min-height: 0; }
svg { width: 100%; height: 100%; display: block; cursor: grab; background:
  radial-gradient(circle at 20% 30%, rgba(255,255,255,.35), transparent 60%), var(--bg); }
svg:active { cursor: grabbing; }
.link { fill: none; stroke: #b9a57c; stroke-width: 1.4; }
.card { cursor: pointer; }
.card .box { width: 226px; height: 56px; display: flex; gap: 8px; align-items: center; padding: 4px 8px 4px 5px; background: var(--card);
  border: 1px solid rgba(156,122,46,0.45); border-left-width: 4px; border-radius: 6px; font-size: 12px; line-height: 1.25; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.card.sel .box { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .box.root { background: #fff8ee; }
.card .nm { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .yr { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
.card .av { width: 38px; height: 46px; border-radius: 3px; object-fit: cover; object-position: 50% 25%; flex: none; background: #e3d7bd; }
.card .av.none { display: grid; place-items: center; color: #8a7a5c; font-family: var(--font-display); font-size: 16px; }
.tog { cursor: pointer; }
.tog circle { fill: var(--card); stroke: #9c7a2e; stroke-width: 1.2; }
.tog text { font: 600 11px var(--font-body); fill: #6b5d43; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tog:hover circle { fill: #f1e2c0; }
#panel { position: absolute; right: 14px; top: 14px; width: 290px; max-width: calc(100% - 28px); background: var(--panel-bg);
  border: 1px solid rgba(156,122,46,0.5); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 14px; display: none; font-size: 13px; }
#panel.show { display: block; }
#panel .x { position: absolute; right: 8px; top: 6px; border: none; background: none; font-size: 18px; color: var(--muted); cursor: pointer; }
#panel .head { display: flex; gap: 10px; }
#panel img, #panel .ph { width: 64px; height: 78px; border-radius: 5px; object-fit: cover; object-position: 50% 25%; background: #e3d7bd; flex: none; }
#panel h2 { font-family: var(--font-display); font-weight: normal; font-size: 19px; margin: 0 0 2px; line-height: 1.15; }
#panel .sub { color: var(--muted); font-size: 12px; }
#panel .acts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
#panel .acts .btn { justify-content: center; }
#hint { position: absolute; left: 14px; bottom: 12px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); background: rgba(245,238,218,.85);
  padding: 4px 8px; border-radius: 4px; }
@media (max-width: 640px) { .key { display: none; } #bar input { width: 170px; } }
</style>
</head>
<body>
<header class="site-head">
  <a class="brand" href="index.html">Family History, Visualized</a>
  <nav class="site-nav"><a href="index.html">Map</a><a href="tree.html" class="on">Tree</a><a href="people.html">People</a><a href="about.html">About</a></nav>
  <span class="spacer"></span><div id="lock-slot"></div>
</header>
<div id="bar">
  <span class="who" id="who"></span>
  <input id="find" type="search" placeholder="Start the tree from someone else&hellip;" autocomplete="off" aria-label="Start the tree from someone else">
  <button id="more">Show one more generation</button><button id="fewer">One fewer</button><button id="home">Back to the start</button>
  <span class="key"><span><i style="background:#0f8a7a"></i>father's side</span><span><i style="background:#e0359e"></i>mother's side</span></span>
</div>
<div id="results"></div>
<div id="wrap">
  <svg id="svg" aria-label="Family tree"><g id="zoom"><g id="links"></g><g id="nodes"></g></g></svg>
  <aside id="panel" aria-live="polite"></aside>
  <div id="hint">drag to move &middot; scroll to zoom &middot; &#x25B8; opens a person's parents &middot; click a person for more</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script src="profiles.js"></script>
<script src="site.js"></script>
<script>
// A pedigree: the root on the left, each generation of parents to the right. A person
// can appear more than once (cousins married), so nodes are keyed by their path.
const W = 226, H = 56, GAPX = 300, GAPY = 66;
const P = GRAPH.people;
let root = GRAPH.james_id, open = new Set(), selected = null;
const svg = d3.select("#svg"), gZoom = d3.select("#zoom");
const zoom = d3.zoom().scaleExtent([0.15, 2]).on("zoom", e => gZoom.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

function openTo(depth) {            // open every path up to `depth` generations
  open = new Set();
  const walk = (pid, path, d) => { if (d >= depth) return; open.add(path);
    for (const q of (P[pid] || {}).parents || []) if (P[q]) walk(q, path + "/" + q, d + 1); };
  walk(root, root, 0);
}
let depthShown = 4;
function build(pid, path, d, side) {
  const par = ((P[pid] || {}).parents || []).filter(q => P[q]);
  const n = { pid, path, d, side, more: par.length > 0, children: null };
  if (open.has(path)) n.children = par.map((q, i) => build(q, path + "/" + q, d + 1, d === 0 ? (Family.sex(q) === "F" ? "m" : "f") : side));
  return n;
}
const SIDE = { f: "#0f8a7a", m: "#e0359e" };
async function render(keepView) {
  const data = d3.hierarchy(build(root, root, 0, ""), n => n.children);
  d3.tree().nodeSize([GAPY, GAPX]).separation((a, b) => a.parent === b.parent ? 1 : 1.15)(data);
  const nodes = data.descendants(), links = data.links();
  d3.select("#links").selectAll("path").data(links, l => l.target.data.path).join("path").attr("class", "link")
    .attr("d", l => `M${l.source.y + W},${l.source.x}C${l.source.y + W + 40},${l.source.x} ${l.target.y - 40},${l.target.x} ${l.target.y},${l.target.x}`);
  const g = d3.select("#nodes").selectAll("g.card").data(nodes, n => n.data.path).join(enter => {
    const e = enter.append("g").attr("class", "card");
    e.append("foreignObject").attr("width", W).attr("height", H).attr("y", -H / 2);
    const t = e.append("g").attr("class", "tog").attr("transform", `translate(${W + 11},0)`);
    t.append("circle").attr("r", 9); t.append("text");
    return e;
  });
  g.attr("transform", n => `translate(${n.y},${n.x})`).classed("sel", n => n.data.path === selected);
  g.select("foreignObject").html(n => {
    const p = P[n.data.pid], pr = PROFILES.people[n.data.pid];
    const face = pr && pr.ph ? `<img class="av" src="${pr.ph[0]}" alt="">` : `<div class="av none" data-pid="${n.data.pid}">${Family.esc((p.name || "?")[0])}</div>`;
    return `<div xmlns="http://www.w3.org/1999/xhtml" class="box${n.depth === 0 ? " root" : ""}" style="border-left-color:${SIDE[n.data.side] || "#9c7a2e"}">${face}
      <div><div class="nm">${Family.esc(p.name)}</div><div class="yr">${Family.esc(Family.years(n.data.pid))}</div></div></div>`;
  });
  g.select(".tog").style("display", n => n.data.more ? null : "none").select("text").text(n => n.children ? "◂" : "▸");
  g.select(".tog").on("click", (e, n) => { e.stopPropagation(); open.has(n.data.path) ? close(n.data.path) : open.add(n.data.path); render(true); });
  g.on("click", (e, n) => { selected = n.data.path; show(n.data.pid); render(true); });
  // the living, once unlocked: their portraits come from the encrypted store
  if (Family.shown) for (const el of document.querySelectorAll(".av.none[data-pid]")) {
    const url = await Family.photo(el.dataset.pid);
    if (url) { const img = document.createElement("img"); img.className = "av"; img.src = url; el.replaceWith(img); }
  }
  if (!keepView) {
    const box = document.getElementById("wrap").getBoundingClientRect();
    svg.call(zoom.transform, d3.zoomIdentity.translate(40, box.height / 2).scale(box.width < 700 ? 0.6 : 0.85));
  }
}
function close(path) { for (const p of [...open]) if (p === path || p.startsWith(path + "/")) open.delete(p); }

async function show(pid) {
  const p = P[pid], panel = document.getElementById("panel");
  if (!p) return;
  const gRoot = Family.generations(root).get(pid), gM = Family.generations(GRAPH.james_id).get(pid);
  const relRoot = pid === root ? "" : Family.relation(gRoot, pid), relM = Family.relation(gM, pid);
  const url = p.name === "Private" ? null : await Family.photo(pid);
  const pr = PROFILES.people[pid];
  const born = pr && (pr.b[0] || pr.b[1]) ? `Born ${[pr.b[0], pr.b[1]].filter(Boolean).map(Family.esc).join(", ")}` : "";
  const died = pr && (pr.d[0] || pr.d[1]) ? `Died ${[pr.d[0], pr.d[1]].filter(Boolean).map(Family.esc).join(", ")}` : "";
  const id = encodeURIComponent(pid);
  panel.innerHTML = `<button class="x" aria-label="Close">&times;</button>
    <div class="head">${url ? `<img src="${url}" alt="">` : `<div class="ph"></div>`}<div><h2>${Family.esc(p.name)}</h2>
    <div class="sub">${Family.esc(Family.years(pid))}</div>
    ${relRoot ? `<div class="sub">${P[root].name === "Private" ? relRoot.charAt(0).toUpperCase() + relRoot.slice(1) : Family.esc(Family.firstName(root)) + "'s " + relRoot}</div>` : ""}
    ${relM && root !== GRAPH.james_id && P[GRAPH.james_id].name !== "Private" ? `<div class="sub">${Family.esc(Family.firstName(GRAPH.james_id))}'s ${relM}</div>` : ""}</div></div>
    ${born ? `<div class="sub" style="margin-top:8px">${born}</div>` : ""}${died ? `<div class="sub">${died}</div>` : ""}
    ${p.name === "Private" ? `<p class="sub">A living member of the family.</p>` : `<div class="acts">
      <a class="btn solid" href="index.html#p=${id}">Open profile</a>
      <a class="btn" href="index.html?life=${id}">Life journey on the map</a>
      <a class="btn" href="index.html?target=${id}">Family history on the map</a>
      ${pid !== root ? `<button class="btn" id="reroot">Start the tree from ${Family.esc(Family.firstName(pid))}</button>` : ""}</div>`}`;
  panel.classList.add("show");
  panel.querySelector(".x").onclick = () => { panel.classList.remove("show"); selected = null; render(true); };
  const rr = panel.querySelector("#reroot"); if (rr) rr.onclick = () => setRoot(pid);
}
function setRoot(pid) {
  root = pid; selected = null; openTo(depthShown);
  document.getElementById("panel").classList.remove("show");
  document.getElementById("who").textContent = `${P[pid].name === "Private" ? "Family" : P[pid].name}'s ancestors`;
  history.replaceState(null, "", pid === GRAPH.james_id ? location.pathname : "#root=" + encodeURIComponent(pid));
  render(false);
}
document.getElementById("more").onclick = () => { depthShown++; openTo(depthShown); render(true); };
document.getElementById("fewer").onclick = () => { depthShown = Math.max(1, depthShown - 1); openTo(depthShown); render(true); };
document.getElementById("home").onclick = () => { depthShown = 4; setRoot(GRAPH.james_id); };

// choose the root by name
const find = document.getElementById("find"), res = document.getElementById("results");
let matches = [], sel = -1;
find.oninput = () => {
  const q = find.value.trim().toLowerCase();
  matches = q ? SEARCH_INDEX.filter(s => s.name.toLowerCase().includes(q) && P[s.id]).slice(0, 20) : [];
  sel = -1;
  res.innerHTML = matches.map((s, i) => `<div data-i="${i}">${Family.esc(s.name)}<span>${s.birt ? "b. " + s.birt : ""}</span></div>`).join("");
  const r = find.getBoundingClientRect();
  Object.assign(res.style, { display: matches.length ? "block" : "none", left: r.left + "px", top: r.bottom + 4 + "px" });
};
res.onclick = e => { const d = e.target.closest("[data-i]"); if (d) pick(+d.dataset.i); };
find.onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(matches.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
    [...res.children].forEach((c, i) => c.classList.toggle("sel", i === sel)); }
  if (e.key === "Enter" && matches.length) pick(Math.max(0, sel));
  if (e.key === "Escape") res.style.display = "none";
};
function pick(i) { res.style.display = "none"; find.value = ""; setRoot(matches[i].id); }

Family.mountLock("lock-slot");
Family.onChange(() => { setRoot(root); });
Family.ready.then(() => {
  const m = location.hash.match(/^#root=(.+)$/);
  const start = m && P[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : GRAPH.james_id;
  openTo(depthShown); setRoot(start);
});
</script>
</body>
</html>
